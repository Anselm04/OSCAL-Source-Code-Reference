name: Import official NIST OSCAL source once
on:
  push:
    paths:
      - '.github/workflows/import-oscal-once.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy pinned upstream OSCAL source without running it
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/usnistgov/OSCAL.git /tmp/nist-oscal
          UPSTREAM_SHA="$(git -C /tmp/nist-oscal rev-parse HEAD)"
          mkdir -p .trillionai
          rsync -a --exclude '.git' --exclude '.github/workflows' /tmp/nist-oscal/ ./
          printf '%s\n' "Official upstream: https://github.com/usnistgov/OSCAL" "Upstream commit: ${UPSTREAM_SHA}" "Imported to: Anselm04/OSCAL-Source-Code-Reference" "Source licensing: see the original LICENSE.md and individual-file notices" "Excluded: upstream GitHub workflows (not executable in this reference mirror)" "No upstream source or build scripts were executed during the copy." > .trillionai/SOURCE_PROVENANCE.txt
          rm -f .github/workflows/import-oscal-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "archive: import genuine NIST OSCAL source and record upstream commit"
          git push origin HEAD:main
